[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tv3-simulations"
version = "0.1.0"
description = "Preparacao de ambientes e simulacoes MIMO de TV 3.0"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "numpy==2.4.3", "pandas==3.0.2", "scipy==1.17.1",
  "matplotlib==3.10.9", "seaborn==0.13.2", "PyYAML==6.0.3", "tqdm>=4.65,<5"
]

[project.optional-dependencies]
preparation = [
  "rasterio==1.5.0", "geopandas==1.1.3", "geopy==2.4.1",
  "scikit-image==0.26.0", "contextily>=1.6,<2", "Pillow>=10", "shapely>=2,<3"
]
notebooks = ["jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tv3_simulations.third_party.py1812" = ["P1812.npz", "NOTICE.md"]
